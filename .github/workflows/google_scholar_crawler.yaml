name: Get Citation Data

on:
  workflow_dispatch:

# Google Scholar frequently blocks shared GitHub-hosted runner IP addresses.
# Scheduled updates are therefore performed by google_scholar_crawler/git_update.sh
# (or git_update.bat) on a trusted local machine/server. This workflow remains
# available as a manual fallback from the Actions page.

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v6
      with:
        python-version: "3.11"
        cache: pip
        cache-dependency-path: google_scholar_crawler/requirements.txt
    - name: Install requirements
      run: pip install -r google_scholar_crawler/requirements.txt
    - name: Fetch and publish citation data
      run: |
        cd ./google_scholar_crawler
        python3 main.py
        cd ./results
        git init
        git config --local user.name "github-actions[bot]"
        git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
        export remote_repo="https://${GITHUB_ACTOR}:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"
        git add *.json
        git commit -m "Updated Citation Data"
        git push "${remote_repo}" HEAD:google-scholar-stats --force
      env:
        GOOGLE_SCHOLAR_ID: "xDDy-DwAAAAJ"
